<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品ライブラリ - ホーム</title>
    <style>
        :root {
            --bg-base: #090d16;
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-card-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-focus: rgba(56, 189, 248, 0.5);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        header {
            padding: 1.25rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
        }

        .search-container {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--glass-border-focus);
            box-shadow: 0 0 16px var(--accent-glow);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            padding: 0.85rem 1.75rem;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        main {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .spinner {
            display: none;
            text-align: center;
            margin: 4rem 0;
            color: var(--accent);
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.75rem;
        }

        .card {
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-6px);
            background: var(--glass-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5),
                        0 0 20px var(--accent-glow);
        }

        .card-img-wrapper {
            width: 100%;
            height: 300px;
            background: rgba(15, 23, 42, 0.4);
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
            background: var(--glass-card);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <header>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="タイトル、作品名で検索...">
            <button onclick="search()">検索</button>
        </div>
    </header>

    <main>
        <div id="spinner" class="spinner">読み込み中...</div>
        <div id="results" class="grid"></div>
    </main>

    <script>
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });

        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const spinner = document.getElementById('spinner');
            const resultsDiv = document.getElementById('results');

            spinner.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                spinner.style.display = 'none';

                if (!data.result || data.result.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state">該当する結果が見つかりませんでした。</div>';
                    return;
                }

                data.result.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `/viewer.html?id=${encodeURIComponent(item.id)}`;

                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${item.image || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (e) {
                spinner.style.display = 'none';
                alert('検索中にエラーが発生しました。');
            }
        }
    </script>
</body>
</html>
