<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品ビューア</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
        }

        header {
            padding: 1.5rem;
            background-color: #1e293b80;
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            max-width: 500px;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .spinner {
            display: none;
            text-align: center;
            margin: 2rem 0;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #334155;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* モーダル UI */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .gallery img {
            width: 100%;
            border-radius: 6px;
        }

        .tag {
            display: inline-block;
            background-color: #334155;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 0.2rem;
        }
    </style>
</head>
<body>

    <header>
        <input type="text" id="searchInput" placeholder="検索ワードを入力...">
        <button onclick="search()">検索</button>
    </header>

    <main>
        <div id="spinner" class="spinner">読み込み中...</div>
        <div id="results" class="grid"></div>
    </main>

    <!-- 詳細モーダル -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        async function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const spinner = document.getElementById('spinner');
            const resultsDiv = document.getElementById('results');

            spinner.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                spinner.style.display = 'none';

                if (!data.result || data.result.length === 0) {
                    resultsDiv.innerHTML = '<p>該当する結果が見つかりませんでした。</p>';
                    return;
                }

                data.result.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetails(item.id);

                    card.innerHTML = `
                        <img src="${item.image || 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${item.title}">
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (e) {
                spinner.style.display = 'none';
                alert('検索中にエラーが発生しました。');
            }
        }

        async function openDetails(id) {
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = '読み込み中...';
            modal.style.display = 'block';

            try {
                const res = await fetch(`/api/proxy-details?id=${encodeURIComponent(id)}`);
                const data = await res.json();

                const tagsHtml = data.tags.map(t => `<span class="tag">${t}</span>`).join('');
                const imagesHtml = data.images.map(img => `<img src="${img}">`).join('');

                modalBody.innerHTML = `
                    <h2>${data.title}</h2>
                    <p><strong>作者:</strong> ${data.author || '不明'} | <strong>サークル:</strong> ${data.circle || '不明'}</p>
                    <p><strong>パロディ:</strong> ${data.parody || 'なし'}</p>
                    <p><strong>ページ数:</strong> ${data.pages} ページ</p>
                    <div>${tagsHtml}</div>
                    <hr style="border-color:#334155; margin: 1.5rem 0;">
                    <h3>ギャラリー</h3>
                    <div class="gallery">${imagesHtml}</div>
                `;

            } catch (e) {
                modalBody.innerHTML = '<p>詳細の取得に失敗しました。</p>';
            }
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
    </script>
</body>
</html>
